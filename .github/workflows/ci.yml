name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12 checks
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure isolated test directories
        shell: pwsh
        run: |
          "NEURAL_WEASEL_HOME=$env:RUNNER_TEMP/NeuralWeasel" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$env:RUNNER_TEMP/LocalAppData" >> $env:GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync test dependencies without Torch
        run: uv sync --extra dev --no-install-package torch

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run Python and install-safety tests
        run: uv run --no-sync pytest

  windows-vertical-slice:
    name: Windows experimental artifact bundle
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out pinned Weasel 0.17.4 tree
        uses: actions/checkout@v4
        with:
          repository: rime/weasel
          ref: 9cc96e20dc71b80876b12f689bb5863c76c2a7ed
          path: external/weasel
          submodules: recursive

      - name: Check out fixed librime headers for boundary targets
        uses: actions/checkout@v4
        with:
          repository: rime/librime
          ref: 1.15.0
          path: external/librime-boundary

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install xmake 3.0.9
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.9"

      - name: Install native header dependencies
        shell: pwsh
        run: >-
          vcpkg install
          nlohmann-json:x64-windows
          boost-signals2:x64-windows
          boost-unordered:x64-windows

      - name: Acquire pinned Boost 1.78.0 source
        shell: pwsh
        run: |
          $Archive = Join-Path $env:RUNNER_TEMP 'boost_1_78_0.7z'
          $Boost = Join-Path $env:RUNNER_TEMP 'boost_1_78_0'
          Invoke-WebRequest `
            -Uri 'https://archives.boost.io/release/1.78.0/source/boost_1_78_0.7z' `
            -OutFile $Archive
          $Expected = '090cefea470bca990fa3f3ed793d865389426915b37a2a3258524a7258f0790c'
          $Actual = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Actual -ne $Expected) {
            throw "Boost archive hash mismatch: $Actual"
          }
          7z x $Archive "-o$env:RUNNER_TEMP" -y
          if (-not (Test-Path -LiteralPath (Join-Path $Boost 'boost')) -or
              -not (Test-Path -LiteralPath (Join-Path $Boost 'bootstrap.bat'))) {
            throw 'Pinned Boost archive did not produce a complete source tree.'
          }
          $YamlCMake = Join-Path $env:GITHUB_WORKSPACE `
            'external/weasel/librime/deps/yaml-cpp/CMakeLists.txt'
          $YamlContent = Get-Content -LiteralPath $YamlCMake -Raw
          $YamlOld = 'cmake_minimum_required(VERSION 3.4)'
          if (-not $YamlContent.Contains($YamlOld)) {
            throw 'Pinned yaml-cpp compatibility seam changed.'
          }
          Set-Content -LiteralPath $YamlCMake -NoNewline `
            -Value $YamlContent.Replace(
              $YamlOld,
              'cmake_minimum_required(VERSION 3.5)'
            )
          Set-Content `
            -LiteralPath "$env:GITHUB_WORKSPACE/external/weasel/env.bat" `
            -Value @(
              "set BOOST_ROOT=$Boost",
              'set BJAM_TOOLSET=msvc-14.2'
            )
          "BOOST_ROOT=$Boost" >> $env:GITHUB_ENV

      - name: Restore pinned native dependency outputs
        id: native_deps_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/boost_1_78_0/b2.exe
            ${{ runner.temp }}/boost_1_78_0/bjam.exe
            ${{ runner.temp }}/boost_1_78_0/stage/lib
            external/weasel/lib
            external/weasel/lib64
            external/weasel/include
            external/weasel/output/rime.dll
            external/weasel/output/Win32/rime.dll
          key: neural-weasel-native-deps-windows-msvc14.2-boost1.78.0-weasel9cc96e2-v3

      - name: Bootstrap pinned Boost.Build for current MSVC
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "$env:BOOST_ROOT/b2.exe")) {
            $Engine = Join-Path $env:BOOST_ROOT 'tools/build/src/engine'
            Push-Location $Engine
            try {
              cmd.exe /d /c 'build.bat msvc'
              if ($LASTEXITCODE -ne 0) {
                throw "Boost.Build bootstrap failed with exit code $LASTEXITCODE."
              }
            } finally {
              Pop-Location
            }
            $BuiltB2 = Join-Path $Engine 'b2.exe'
            if (-not (Test-Path -LiteralPath $BuiltB2 -PathType Leaf)) {
              throw 'Boost.Build bootstrap did not produce b2.exe.'
            }
            Copy-Item -LiteralPath $BuiltB2 `
              -Destination "$env:BOOST_ROOT/b2.exe" -Force
          }

      - name: Build pinned Boost and Weasel librime dependencies
        if: steps.native_deps_cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: external/weasel
        run: build.bat boost librime

      - name: Verify pinned native dependency outputs
        shell: pwsh
        run: |
          $Required = @(
            "$env:BOOST_ROOT/b2.exe",
            "$env:GITHUB_WORKSPACE/external/weasel/lib64/rime.lib",
            "$env:GITHUB_WORKSPACE/external/weasel/output/rime.dll",
            "$env:GITHUB_WORKSPACE/external/weasel/include/rime_api.h"
          )
          foreach ($Path in $Required) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "Pinned native dependency output is missing: $Path"
            }
          }
          if (-not (Get-ChildItem -LiteralPath "$env:BOOST_ROOT/stage/lib" `
              -Filter '*.lib' -File -ErrorAction SilentlyContinue)) {
            throw 'Pinned Boost library output is missing.'
          }

      - name: Save pinned native dependency outputs
        if: steps.native_deps_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/boost_1_78_0/b2.exe
            ${{ runner.temp }}/boost_1_78_0/bjam.exe
            ${{ runner.temp }}/boost_1_78_0/stage/lib
            external/weasel/lib
            external/weasel/lib64
            external/weasel/include
            external/weasel/output/rime.dll
            external/weasel/output/Win32/rime.dll
          key: neural-weasel-native-deps-windows-msvc14.2-boost1.78.0-weasel9cc96e2-v3

      - name: Apply isolated experimental Weasel overlay
        shell: pwsh
        run: |
          ./scripts/prepare-weasel-overlay.ps1 `
            -WeaselRoot "$env:GITHUB_WORKSPACE/external/weasel"

      - name: Configure repository native targets
        shell: pwsh
        run: |
          cmake -S native -B build/native -A x64 `
            -DNEURAL_WEASEL_BUILD_NATIVE_TESTS=ON `
            -DNEURAL_WEASEL_BUILD_RIME_PLUGIN=ON `
            -DNEURAL_WEASEL_BUILD_PROFILE_TOOL=ON `
            -DRIME_ROOT="$env:GITHUB_WORKSPACE/external/librime-boundary" `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build repository native targets
        run: cmake --build build/native --config Release --parallel

      - name: Run native CTest suite
        run: ctest --test-dir build/native -C Release --output-on-failure

      - name: Build experimental TSF, server, and static neural module
        shell: pwsh
        working-directory: external/weasel
        env:
          VERSION_MAJOR: "0"
          VERSION_MINOR: "17"
          VERSION_PATCH: "4"
          FILE_VERSION: "0.17.4.0"
          PRODUCT_VERSION: "0.17.4-neural-experimental"
          NEURAL_WEASEL_ROOT: ${{ github.workspace }}
          VCPKG_ROOT: C:/vcpkg
        run: |
          xmake f -p windows -a x64 -m release -y
          xmake build -y WeaselTSF
          xmake build -y WeaselServer

      - name: Assemble hashed installable bundle
        shell: pwsh
        run: |
          ./scripts/build-windows-bundle.ps1 `
            -WeaselRoot "$env:GITHUB_WORKSPACE/external/weasel" `
            -NativeBuildRoot "$env:GITHUB_WORKSPACE/build/native" `
            -RepositoryCommit "$env:GITHUB_SHA"

      - name: Verify binary and resource isolation
        shell: pwsh
        run: |
          python scripts/verify-windows-bundle.py `
            dist/neural-weasel-experimental

      - name: Exercise fail-closed install and uninstall dry runs
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}/NeuralWeaselLocalAppData
        run: |
          ./scripts/test-install-safety.ps1 `
            -BundleRoot ./dist/neural-weasel-experimental

      - name: Upload complete Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: neural-weasel-experimental-x64
          path: dist/neural-weasel-experimental
          if-no-files-found: error
          retention-days: 14
