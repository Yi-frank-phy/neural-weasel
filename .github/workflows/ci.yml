name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12 checks
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure isolated test directories
        shell: pwsh
        run: |
          "NEURAL_WEASEL_HOME=$env:RUNNER_TEMP/NeuralWeasel" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$env:RUNNER_TEMP/LocalAppData" >> $env:GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync test dependencies without Torch
        run: uv sync --extra dev --no-install-package torch

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Test
        run: uv run --no-sync pytest

  native-windows:
    name: Native Windows boundaries
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out fixed librime source
        uses: actions/checkout@v4
        with:
          repository: rime/librime
          ref: 1.15.0
          path: external/librime

      - name: Install nlohmann-json
        shell: pwsh
        run: vcpkg install nlohmann-json:x64-windows

      - name: Configure native targets
        shell: pwsh
        run: |
          cmake -S native -B build/native -A x64 `
            -DNEURAL_WEASEL_BUILD_NATIVE_TESTS=ON `
            -DNEURAL_WEASEL_BUILD_RIME_PLUGIN=ON `
            -DRIME_ROOT="$env:GITHUB_WORKSPACE/external/librime" `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build native targets
        run: cmake --build build/native --config Release

      - name: Run native tests
        run: ctest --test-dir build/native -C Release --output-on-failure
