name: PR36 pinned Weasel diagnostics

"on":
  push:
    branches:
      - codex/combine-candidate-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-weasel-diagnostic:
    name: Pinned Weasel compile diagnostics
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out pinned Weasel 0.17.4 tree
        uses: actions/checkout@v4
        with:
          repository: rime/weasel
          ref: 9cc96e20dc71b80876b12f689bb5863c76c2a7ed
          path: external/weasel
          submodules: recursive

      - name: Configure VS 2022 MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install xmake 3.0.9
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.9"

      - name: Install native header dependencies
        shell: pwsh
        run: >-
          vcpkg install
          nlohmann-json:x64-windows
          boost-signals2:x64-windows
          boost-unordered:x64-windows

      - name: Acquire pinned Boost 1.78.0 source
        shell: pwsh
        run: |
          $Archive = Join-Path $env:RUNNER_TEMP 'boost_1_78_0.7z'
          $Boost = Join-Path $env:RUNNER_TEMP 'boost_1_78_0'
          Invoke-WebRequest `
            -Uri 'https://archives.boost.io/release/1.78.0/source/boost_1_78_0.7z' `
            -OutFile $Archive
          $Expected = '090cefea470bca990fa3f3ed793d865389426915b37a2a3258524a7258f0790c'
          $Actual = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Actual -ne $Expected) {
            throw "Boost archive hash mismatch: $Actual"
          }
          7z x $Archive "-o$env:RUNNER_TEMP" -y | Out-Null
          $YamlCMake = Join-Path $env:GITHUB_WORKSPACE `
            'external/weasel/librime/deps/yaml-cpp/CMakeLists.txt'
          $YamlContent = Get-Content -LiteralPath $YamlCMake -Raw
          $YamlOld = 'cmake_minimum_required(VERSION 3.4)'
          if (-not $YamlContent.Contains($YamlOld)) {
            throw 'Pinned yaml-cpp compatibility seam changed.'
          }
          Set-Content -LiteralPath $YamlCMake -NoNewline `
            -Value $YamlContent.Replace($YamlOld, 'cmake_minimum_required(VERSION 3.5)')
          Set-Content `
            -LiteralPath "$env:GITHUB_WORKSPACE/external/weasel/env.bat" `
            -Value @(
              "set BOOST_ROOT=$Boost",
              'set BJAM_TOOLSET=msvc-14.3',
              'set PLATFORM_TOOLSET=v143'
            )
          "BOOST_ROOT=$Boost" >> $env:GITHUB_ENV

      - name: Restore pinned native dependency outputs
        id: native_deps_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/boost_1_78_0/b2.exe
            ${{ runner.temp }}/boost_1_78_0/bjam.exe
            ${{ runner.temp }}/boost_1_78_0/stage/lib
            external/weasel/lib
            external/weasel/lib64
            external/weasel/include
            external/weasel/output/rime.dll
            external/weasel/output/Win32/rime.dll
          key: neural-weasel-native-deps-windows2022-default-msvc-v143-boost1.78.0-weasel9cc96e2-v5

      - name: Bootstrap pinned Boost.Build for VS 2022
        if: steps.native_deps_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $Engine = Join-Path $env:BOOST_ROOT 'tools/build/src/engine'
          Push-Location $Engine
          try {
            cmd.exe /d /c 'build.bat msvc'
            if ($LASTEXITCODE -ne 0) {
              throw "Boost.Build bootstrap failed with exit code $LASTEXITCODE."
            }
          } finally {
            Pop-Location
          }
          Copy-Item -LiteralPath (Join-Path $Engine 'b2.exe') `
            -Destination "$env:BOOST_ROOT/b2.exe" -Force

      - name: Build pinned Boost and librime dependencies on cache miss
        if: steps.native_deps_cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: external/weasel
        run: |
          cmd.exe /d /c 'build.bat boost librime'
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned dependency build failed with exit code $LASTEXITCODE."
          }

      - name: Apply isolated experimental Weasel overlay
        shell: pwsh
        run: |
          ./scripts/prepare-weasel-overlay.ps1 `
            -WeaselRoot "$env:GITHUB_WORKSPACE/external/weasel"

      - name: Build pinned overlay with full diagnostics
        id: pinned_build
        shell: pwsh
        working-directory: external/weasel
        env:
          VERSION_MAJOR: "0"
          VERSION_MINOR: "17"
          VERSION_PATCH: "4"
          FILE_VERSION: "0.17.4.0"
          PRODUCT_VERSION: "0.17.4-neural-experimental"
          NEURAL_WEASEL_ROOT: ${{ github.workspace }}
          VCPKG_ROOT: C:/vcpkg
        run: |
          $Diagnostics = Join-Path $env:RUNNER_TEMP 'pinned-weasel-diagnostics'
          New-Item -ItemType Directory -Path $Diagnostics -Force | Out-Null

          function Invoke-XmakeLogged {
            param(
              [Parameter(Mandatory)][string]$Name,
              [Parameter(Mandatory)][string[]]$Arguments
            )
            $Log = Join-Path $Diagnostics "$Name.log"
            & xmake @Arguments 2>&1 | Tee-Object -FilePath $Log
            $Code = $LASTEXITCODE
            "exit_code=$Code" | Add-Content -LiteralPath $Log
            if ($Code -ne 0) {
              throw "xmake $Name failed with exit code $Code; see diagnostic artifact."
            }
          }

          Invoke-XmakeLogged -Name 'configure' `
            -Arguments @('f', '-p', 'windows', '-a', 'x64', '-m', 'release', '-y')
          Invoke-XmakeLogged -Name 'WeaselTSF' `
            -Arguments @('build', '-vD', '-y', 'WeaselTSF')
          Invoke-XmakeLogged -Name 'WeaselServer' `
            -Arguments @('build', '-vD', '-y', 'WeaselServer')

      - name: Upload pinned Weasel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr36-pinned-weasel-diagnostics
          path: ${{ runner.temp }}/pinned-weasel-diagnostics
          if-no-files-found: warn
          retention-days: 3
