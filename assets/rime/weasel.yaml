config_version: "0.2"

style:
  display_tray_icon: true
  inline_preedit: false
  label_format: "%s."
  color_scheme: neural_light
  font_face: "Microsoft YaHei"
  label_font_face: "Microsoft YaHei"
  comment_font_face: "Microsoft YaHei"
  font_point: 14
  label_font_point: 12
  comment_font_point: 12
  layout:
    min_width: 160
    margin_x: 10
    margin_y: 8
    spacing: 6
    candidate_spacing: 4
    hilite_padding: 4
    corner_radius: 6

preset_color_schemes:
  neural_light:
    name: "Neural Light"
    author: "Neural Weasel contributors"
    text_color: 0x1f1f1f
    back_color: 0xf7f7f7
    border_color: 0xd0d0d0
    candidate_text_color: 0x1f1f1f
    candidate_back_color: 0xf7f7f7
    label_color: 0x666666
    comment_text_color: 0x777777
    hilited_text_color: 0x1f1f1f
    hilited_back_color: 0xe8e8e8
    hilited_candidate_text_color: 0xffffff
    hilited_candidate_back_color: 0xd77800
    hilited_label_color: 0xffffff
    hilited_comment_text_color: 0xffffff
