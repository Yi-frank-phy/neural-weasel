config_version: "0.2"

style:
  display_tray_icon: true
  inline_preedit: false
  label_format: "%s."
  color_scheme: neural_weasel_default
  font_point: 12
  label_font_point: 12
  comment_font_point: 12
  layout:
    min_width: 160
    border_width: 1
    margin_x: 8
    margin_y: 8
    spacing: 6
    candidate_spacing: 4
    hilite_spacing: 4
    hilite_padding: 2
    corner_radius: 4

preset_color_schemes:
  neural_weasel_default:
    name: Neural Weasel Default
    back_color: 0xffffff
    text_color: 0x000000
    candidate_text_color: 0x000000
    candidate_back_color: 0xffffff
    border_color: 0xd0d0d0
    hilited_text_color: 0x000000
    hilited_back_color: 0xe8e8e8
    hilited_candidate_text_color: 0xffffff
    hilited_candidate_back_color: 0x3a6ea5
    label_color: 0x606060
    comment_text_color: 0x606060
