[project]
name = "neural-weasel"
version = "0.1.0"
description = "A local Base-model-first neural pinyin IME experiment for Weasel"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "accelerate>=1.10",
    "bitsandbytes>=0.49",
    "huggingface-hub>=0.35",
    "pypinyin>=0.55",
    "pywin32>=311; sys_platform == 'win32'",
    "torch>=2.8",
    "transformers>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.13",
]

[project.scripts]
neural-weasel = "neural_weasel.launcher:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_weasel"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
